<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registation Form</title>

    <!-- icon  -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=badge,person,mail" />

    <!-- style sheet -->
    <link rel="stylesheet" href="./sytle.css">

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet"> -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

</head>
<body>
    <main >
        <div class="mb-20">
            <!-- Registation form  -->
            <div class="form-container position-relative">
                <div class="top-border position-absolute top-0 left-0 right-0"></div>
                <h2 class="heading-from">Registation Form</h2>
                <form action="">

                    <div class="form-field">
                        <div class="input-icon">
                            <span class="material-symbols-outlined">
                                mail
                                </span>
                        </div>
                        <input type="email" placeholder="Email">
                    </div>

                    <div class="form-field">
                        <div class="input-icon">
                            <span class="material-symbols-outlined">
                                lock
                                </span>
                        </div>
                        <input type="password" placeholder="Password">
                    </div>

                    <div class="form-field">
                        <div class="input-icon">
                            <span class="material-symbols-outlined">
                                lock
                                </span>
                        </div>
                        <input type="password" placeholder="Re-type Password">
                    </div>

                    <div class="flex gap">
                        <div class="form-field">
                            <div class="input-icon">
                                <span class="material-symbols-outlined">
                                    person
                                    </span>
                            </div>
                            <input type="text" placeholder="First Name">
                        </div>
    
                        <div class="form-field">
                            <div class="input-icon">
                                <span class="material-symbols-outlined">
                                    person
                                    </span>
                            </div>
                            <input type="text" placeholder="Last Name">
                        </div>

                    </div>

                    <div class="flex gap-20 mb-20 p-5">
                        <div class="">
                            <input  type="radio" name="gender" id="male">
                            <label class="black-60" for="male">Male</label>
                        </div>
                        <div class="">
                            <input  type="radio" name="gender" id="female">
                            <label class="black-60" for="female">Female</label>
                        </div>
                    </div>

                    <div class="form-field">
                        <select>
                            <option value="">Select a District</option>
                            <option value="">Dhaka</option>
                            <option value="">Jessore</option>
                        </select>
                    </div>

                    <div class="mb-10 p-5">
                        <input type="checkbox" id="terms_and_condition">
                        <label for="terms_and_condition" class="black-60 letter-spacing-1">I agree with terms and conditions</label>
                    </div>

                    <div class="mb-20 p-5">
                        <input type="checkbox" id="newslatter">
                        <label for="newslatter" class="black-60 letter-spacing-1">I want to recevie the newslatter</label>
                    </div>

                    <div class="mb-20 p-5">
                        <button class="btn" type="submit">Register</button>
                    </div>

                </form>
            </div>
        </div>
    </main>
</body>
</html>
