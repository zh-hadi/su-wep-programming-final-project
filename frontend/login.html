<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registation Form</title>

    <!-- icon  -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=badge,person,mail" />

    <!-- style sheet -->
    <link rel="stylesheet" href="./css/style.css">

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet"> -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

</head>
<body>
    <main >
        <div class="mb-20">
            <!-- Registation form  -->
            <div class="form-container position-relative">
                <div class="top-border position-absolute top-0 left-0 right-0"></div>
                <h2 class="heading-from">Login Form</h2>
                <form action="" id="login-form">

                    <div class="form-field">
                        <div class="input-icon">
                            <span class="material-symbols-outlined">
                                mail
                                </span>
                        </div>
                        <input type="email" placeholder="Email">
                    </div>

                    <div class="form-field">
                        <div class="input-icon">
                            <span class="material-symbols-outlined">
                                lock
                                </span>
                        </div>
                        <input type="password" placeholder="Password">
                    </div>

                    
                    <div class="mb-20 p-5">
                        <button class="btn" type="submit">Register</button>
                    </div>

                </form>
            </div>
        </div>
    </main>



   <script src="./js/script.js"></script>
</body>
</html>
