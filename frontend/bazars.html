   <script>
        const fetchBazarData =async () => {
            const res = await fetch('http://localhost:3000/api/bazars');
            const data = await res.json();

            console.log(data);
            addBazarList(data.data);
        }

        fetchBazarData();

        const addBazarList = (data) => {
            let user = JSON.parse(localStorage.getItem('authuser'));
            let html = ``;
            data.forEach((bazar, index) => {
                console.log(bazar)
                // console.log(JSON.parse(bazar.food_list));
                html += `
                     <tr>
                        <td>${++index}</td>
                        <td>${bazar.firstname + " " + bazar.lastname}</td>
                        <td>${bazar.total_amount}</td>
                        <td>${formatDate(bazar.date)}</td>
                        <td>
                           ${
                            user.id === bazar.user_id ?
                            `<a href="http://localhost:3000/edit-bazar/${bazar.id}">
                                    <span class="material-symbols-outlined">
                                    edit_square
                                    </span>
                            </a>
                            <button class="pointer" onclick="deleteBazar(this, ${bazar.id})">
                                <span class="material-symbols-outlined">
                                    delete
                                </span>
                            </button>
                            </td>` : `--`
                            } 
                    </tr>
                `;
            });
            const tableBody = document.getElementById('table-body');
            tableBody.innerHTML = html;
        }
   </script>
