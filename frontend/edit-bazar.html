   <script>
        const getBazarData =async () => {
            const path = window.location.pathname; 
            const segments = path.split('/');      
            const bazarId = segments[2];    
            
            // alert(bazarId);
            try{
                const res = await fetch("http://localhost:3000/api/bazars/"+bazarId);
                const data = await res.json();

                let bazar = data.data[0];

                console.log(bazar)

                document.getElementById('edit-form-bazar-date').value = formatDateForBazar(bazar.date);
                document.getElementById('edit-form-bazar-id').value = bazar.id
                document.getElementById('total-pirce-show').innerText = bazar.total_amount;
                console.log(bazar);
                itemListAdd(JSON.parse(bazar.food_list));
            }catch(err){
                console.log("error happend: "+ err);
            }
        }

        getBazarData();

        const itemListAdd = (data) => {
            console.log(data)
            let html = ``;
            data.forEach((foodItem, index) => {
                 html += `
                    <div class="form-item-all">
                        <div class="form-item-single">
                            <input class="item-serial" type="text" value="${++index}">
                        </div>
                        <div class="form-item-single">
                            <input type="text" name="name[]" value="${foodItem.name}">
                        </div>
                        <div class="form-item-single">
                            <input class="total_price_cal" onchange="calculateTotalPrice()" type="text"  name="price[]" value="${foodItem.price}">
                        </div>
                        <div class="form-item-single">
                            <input type="text" name="qty[]" value="${foodItem.qty}">
                        </div>
                    </div>
                `;

            });

            document.querySelector('.item-add-btn').dataset.itemCount = data.length;

            document.getElementById('list-label').insertAdjacentHTML('afterend', html);
        }
   </script>
